# Compose stack deployed to /opt/chopnow/staging/docker-compose.yml on the
# DigitalOcean staging droplet. Driven by the CI deploy job:
#   1. Builds + pushes ghcr.io/chopnow-app/chopnow-api:staging-<sha>
#   2. SCPs this file + a generated .env to the droplet
#   3. SSHes `docker compose pull && up -d --remove-orphans`
#   4. Runs `prisma migrate deploy` as a one-shot via `docker compose run --rm`
#
# Substituted env vars come from the .env file in the same directory at apply
# time. The .env is regenerated on every deploy from GitHub environment
# secrets — never committed.
#
# ─── What's NOT in this file (intentionally) ──────────────────────────
# Caddy reverse-proxy + Let's Encrypt TLS terminator runs at the HOST
# level on the droplet (not in compose). It listens on :443, terminates
# TLS for api-staging.tchopnow.app, and forwards to 127.0.0.1:3001 →
# the `api` service below. Config lives at /etc/caddy/Caddyfile on the
# droplet; the version-controlled source of truth is `./caddy/Caddyfile`
# in this repo. See `./caddy/README.md` for why it's host-level + how
# to update it.

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: chopnow-staging-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: chopnow
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: chopnow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U chopnow']
      interval: 5s
      timeout: 3s
      retries: 10
    # Not exposed to the host — only reachable from the compose network.

  redis:
    image: redis:7-alpine
    container_name: chopnow-staging-redis
    restart: unless-stopped
    # AOF persistence: every write fsync'd once per second. Loses ≤ 1s of
    # writes on a hard kill, vs the default RDB-only mode which can lose
    # minutes. Important because BullMQ stores its delayed-job state here
    # (dispatch retries, notification fan-out, order-lifecycle scheduling).
    # Without persistence, every redeploy would lose in-flight jobs and
    # rely on the polling-cron safety net to catch up.
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    # Same: compose-internal only.

  api:
    # Pulled from GitHub Container Registry. Pushed by chopnow-api's
    # cd-staging.yml workflow on every push to the `staging` branch.
    # The package is private (org disallows public packages); the deploy
    # workflow runs `docker login ghcr.io` on the droplet before
    # `docker compose pull` using STAGING_GHCR_TOKEN (classic PAT,
    # scope: read:packages only).
    image: ghcr.io/chopnow-app/chopnow-api:staging-${IMAGE_TAG}
    container_name: chopnow-staging-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    ports:
      # Exposed to the world via the DO cloud firewall (port 3001 inbound
      # is currently not opened — we'll reach the API on this host:port
      # through SSH tunneling for the first deploy, then open the firewall
      # rule once nginx + TLS lands. The deploy verifies /health locally
      # from the droplet, not over the public internet.
      - '127.0.0.1:3001:3001'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3001/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5

  # Phase O2.2 — Grafana Alloy scrapes the api container's /metrics
  # endpoint over the internal Docker network and remote-writes the
  # result to Grafana Cloud Prometheus.
  #
  # Config lives at /opt/chopnow/staging/alloy/config.alloy on the
  # droplet (SCP'd by the deploy workflow from deploy/alloy/config.alloy
  # in the repo). The 3 env vars below are read from .env which is
  # rendered from GitHub environment secrets at deploy time.
  #
  # Inert when PROM_REMOTE_WRITE_URL is empty — Alloy still starts but
  # the remote_write component logs a warning and drops samples. Same
  # safety property as the pino-loki transport.
  alloy:
    image: grafana/alloy:latest
    container_name: chopnow-staging-alloy
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      PROM_REMOTE_WRITE_URL: ${PROM_REMOTE_WRITE_URL}
      GRAFANA_USERNAME: ${GRAFANA_USERNAME}
      GRAFANA_TOKEN: ${GRAFANA_TOKEN}
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloydata:/var/lib/alloy/data
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    # No public port exposure — Alloy's UI (port 12345) stays inside
    # the compose network. SSH-tunnel if you need to debug.

volumes:
  alloydata:
    name: chopnow_staging_alloydata
  pgdata:
    name: chopnow_staging_pgdata
  redisdata:
    name: chopnow_staging_redisdata
