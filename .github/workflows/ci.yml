# Continuous Integration — verification only.
# Deploys live in cd-staging.yml and cd-production.yml.
#
# Tiers (controlled by step-level `if:` so the required check name
# `lint-test-build` stays stable across all branches' rulesets):
#
#   Tier 1 — every feature-branch push + every PR: lint, typecheck, unit
#            tests, dep audit, secret scan, SAST. Targets ~1 minute.
#   Tier 2 — every PR: integration tests (testcontainers PostGIS),
#            full nest build, e2e suite. Skipped on feature-branch pushes
#            to keep the inner loop fast.
#   Tier 2.5 — PR → staging or main: amd64 docker build. Catches
#            Dockerfile regressions before they reach a deploy branch.
#   Tier 3 — PR → main only: arm64 docker build (Hetzner target) + Trivy
#            scan, blocking on HIGH/CRITICAL.
#
# Push to staging/main does NOT run CI here — the PR that produced those
# commits already passed CI, and the CD workflows take over post-merge.

name: CI

on:
  workflow_dispatch:
  push:
    # Only feature branches. Trunk branches (develop, staging, main) only ever
    # receive PR-merged commits, which were already validated by the PR-time CI.
    branches-ignore:
      - develop
      - staging
      - main
  pull_request:
    branches: [develop, staging, main]

# Cancel in-progress runs on the same ref. Saves runner minutes during
# rapid iteration on a feature branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Opt every JS action into Node 24 ahead of GitHub's June 2, 2026 forced
# migration. Drop once bundled actions ship Node 24 builds.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    # Sidecar services available throughout the job. Redis boots in ~2s and is
    # required by AppModule (E2E tests import the full module). Postgres for
    # integration / E2E is provided via testcontainers — no service needed for it.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans git history — needs the full repo, not a shallow clone.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx prisma generate

      # ─── Tier 1: every push + every PR ───────────────────────────────
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (with coverage)
        # Coverage written to ./coverage/ and reported to the GitHub
        # Actions job summary so reviewers see overall + per-file %
        # without leaving the PR. Free; no Codecov dep. When we want
        # a hosted dashboard with PR diff overlays, swap to Codecov
        # (Phase 2 — add when a 2nd dev joins).
        run: npm run test:coverage

      - name: Publish coverage to job summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e "
              const s = require('./coverage/coverage-summary.json').total;
              const pct = (m) => s[m].pct.toFixed(1) + '%';
              const bar = (v) => v >= 80 ? '🟢' : v >= 60 ? '🟡' : '🔴';
              const out = [
                '## Test coverage',
                '',
                '| Metric | % | |',
                '|--------|----|----|',
                \`| Statements | \${pct('statements')} | \${bar(s.statements.pct)} |\`,
                \`| Branches   | \${pct('branches')}   | \${bar(s.branches.pct)} |\`,
                \`| Functions  | \${pct('functions')}  | \${bar(s.functions.pct)} |\`,
                \`| Lines      | \${pct('lines')}      | \${bar(s.lines.pct)} |\`,
                '',
                '_Thresholds: 🟢 ≥80%, 🟡 ≥60%, 🔴 <60%. Visibility only; no PR-blocking gate yet (Phase 1)._',
              ].join('\n');
              require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, out + '\n');
            "
          else
            echo '_(coverage report not generated — test step likely failed)_' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Security audit (deps)
        # Blocks on high+ vulnerabilities. Dependabot opens auto-fix PRs
        # for routine updates; this gate makes sure no PR introduces a
        # known CVE without also resolving it.
        run: npm audit --audit-level=high

      - name: Secrets scan (gitleaks)
        # Catches accidentally committed credentials in the diff or history.
        # Binary pinned (not the action) because gitleaks-action requires a
        # paid license for commercial orgs.
        run: |
          GITLEAKS_VERSION=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar xz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --redact --exit-code 1 --no-banner

      - name: SAST scan (Semgrep)
        # Static analysis for Node/TS security issues. 0 findings on develop
        # today; any new PR that introduces a flagged pattern fails here.
        run: |
          python3 -m pip install --quiet semgrep
          semgrep scan \
            --config=p/typescript \
            --config=p/security-audit \
            --metrics=off \
            --error \
            src/

      # ─── Tier 2: PR only (skipped on feature pushes — too slow for inner loop) ─
      - name: Integration tests
        if: github.event_name == 'pull_request'
        # ubuntu-latest has Docker; testcontainers boots a postgis image and
        # applies Prisma migrations against it. ~30s overhead; catches real-DB
        # regressions (PostGIS, transactions, unique constraints) before merge.
        run: npm run test:integration

      - name: Build
        if: github.event_name == 'pull_request'
        run: npm run build

      - name: E2E tests
        # Boots the full AppModule against an ephemeral PostGIS via testcontainers,
        # overrides only the OtpDeliveryService to capture the plaintext OTP, then
        # exercises the real HTTP routes (request-otp → verify-otp → /users/me).
        # ~12s including container startup.
        if: github.event_name == 'pull_request'
        run: npm run test:e2e

      - name: Migration sanity check (warning only)
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.changed_files, 'prisma/migrations/')
        run: echo "::warning::This PR modifies Prisma migrations. Verify they're idempotent and reversible."

      # ─── Tier 2.5: PR → staging or main (image build verification) ───
      # Doesn't push anywhere — just proves the Dockerfile compiles. The CD
      # workflows do the actual push + deploy on post-merge.
      - name: Build production Docker image (amd64 — staging target)
        if: github.event_name == 'pull_request' && (github.base_ref == 'staging' || github.base_ref == 'main')
        run: docker build -t chopnow-api:${{ github.sha }}-amd64 .

      # ─── Tier 3: PR → main only (arm64 build + Trivy) ────────────────
      # arm64 = Hetzner CAX11 prod target. Built via QEMU on the amd64 runner,
      # then scanned with Trivy. HIGH/CRITICAL findings block the merge.
      - name: Set up QEMU (arm64 emulation)
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up buildx
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        uses: docker/setup-buildx-action@v3

      - name: Build production image (arm64 — Hetzner target)
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --load \
            -t chopnow-api:${{ github.sha }}-arm64 \
            .

      - name: Trivy container scan (arm64 image)
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: chopnow-api:${{ github.sha }}-arm64
          format: table
          severity: HIGH,CRITICAL
          # Block the merge on any HIGH or CRITICAL finding.
          exit-code: '1'
          # Don't fail solely on Trivy failing to fetch its DB (transient infra issue).
          ignore-unfixed: true
