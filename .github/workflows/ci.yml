# Multi-tier CI + deploy.
#
# Tier 1 — every feature-branch push + every PR: fast feedback for the
#         developer. Lint, typecheck, unit tests, dep audit, secret scan, SAST.
#         Targets ~1 minute.
#
# Tier 2 — every PR (skipped on feature pushes to save runner minutes):
#         Integration tests against an ephemeral PostGIS via testcontainers,
#         then a full nest build. Targets ~3 minutes.
#
# Tier 2.5 — PRs targeting `staging` or `main`: also build the production
#         Docker image. Catches Dockerfile regressions one tier earlier than
#         only-on-main.
#
# Tier 3 — PR → main only: Trivy scan of the built image. HIGH/CRITICAL
#         OS-level vulns block the merge.
#
# Deploy:
# - push to staging → deploy-staging job (DigitalOcean droplet, ~26 juin 2026)
# - push to main    → deploy-production job (Hetzner CAX11 Falkenstein)
#
# Why one CI job (and not three): the rulesets on `develop` / `staging` / `main`
# require the status check named `lint-test-build`. Splitting the gate jobs
# would force ruleset edits. We use step-level `if:` instead so the required
# check name stays stable while the work tiers up by trigger. Deploy jobs
# are separate (they don't gate merges, they react to merges).

name: CI

on:
  workflow_dispatch:
  # Run on push EXCEPT to develop (only ever PR-merged commits, already
  # validated by the PR's check). Staging and main DO get push CI because
  # we want a final post-merge validation gate before deploy fires.
  push:
    branches-ignore:
      - develop
  pull_request:
    branches: [develop, staging, main]

# Cancel in-progress runs on the same ref. Deploy jobs follow the gate; if
# a newer commit arrives mid-run, the older deploy is cancelled — the newer
# one runs to completion, leaving the system at the latest state.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    # Sidecar services available throughout the job. Redis boots in ~2s and is
    # required by AppModule (E2E tests import the full module). Postgres for
    # integration / E2E is provided via testcontainers — no service needed for it.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans git history — needs the full repo, not a shallow clone.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx prisma generate

      # ─── Tier 1: every push + every PR ───────────────────────────────
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Security audit (deps)
        # Blocks on high+ vulnerabilities. Dependabot opens auto-fix PRs
        # for routine updates; this gate makes sure no PR introduces a
        # known CVE without also resolving it.
        run: npm audit --audit-level=high

      - name: Secrets scan (gitleaks)
        # Catches accidentally committed credentials in the diff or history.
        # We use the binary directly (not gitleaks-action) because the action
        # requires a paid license for commercial orgs. Bump GITLEAKS_VERSION
        # manually on advisory; the binary is reproducible from a tagged release.
        run: |
          GITLEAKS_VERSION=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar xz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --redact --exit-code 1 --no-banner

      - name: SAST scan (Semgrep)
        # Static analysis for Node/TS security issues (auth bypass, SSRF, XSS,
        # SQL/NoSQL injection patterns, etc.). 0 findings on develop today;
        # any new PR that introduces a flagged pattern fails here.
        run: |
          python3 -m pip install --quiet semgrep
          semgrep scan \
            --config=p/typescript \
            --config=p/security-audit \
            --metrics=off \
            --error \
            src/

      # ─── Tier 2: PR only (skipped on feature pushes — too slow for inner loop) ─
      - name: Integration tests
        if: github.event_name == 'pull_request'
        # ubuntu-latest has Docker; testcontainers boots a postgis image and
        # applies Prisma migrations against it. ~30s overhead; catches real-DB
        # regressions (PostGIS, transactions, unique constraints) before merge.
        run: npm run test:integration

      - name: Build
        if: github.event_name == 'pull_request'
        run: npm run build

      - name: E2E tests
        # Boots the full AppModule against an ephemeral PostGIS via testcontainers,
        # overrides only the OtpDeliveryService to capture the plaintext OTP, then
        # exercises the real HTTP routes (request-otp → verify-otp → /users/me).
        # ~12s including container startup.
        if: github.event_name == 'pull_request'
        run: npm run test:e2e

      - name: Migration sanity check (warning only)
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.changed_files, 'prisma/migrations/')
        run: echo "::warning::This PR modifies Prisma migrations. Verify they're idempotent and reversible."

      # ─── Tier 2.5: PR → staging or main (image build) ────────────────
      # Catches Dockerfile regressions before they reach a deployable branch.
      # PR → develop deliberately skips this — fast inner loop matters more
      # there than catching prod-image issues that early.
      - name: Build production Docker image (amd64 — staging target)
        if: github.event_name == 'pull_request' && (github.base_ref == 'staging' || github.base_ref == 'main')
        # Native amd64 build on the ubuntu-latest runner. Validates that the
        # Dockerfile + production install graph still works — covers DO staging
        # which runs Intel/AMD x86_64. Hetzner prod runs arm64 (CAX11 Ampere);
        # that variant is built + scanned by the Trivy step below on PR → main.
        # Single-arch keeps this step fast (~20s) so the inner loop on
        # develop → staging stays tight.
        run: docker build -t chopnow-api:${{ github.sha }}-amd64 .

      # ─── Tier 3: PR → main only (arm64 build + Trivy) ────────────────
      # The amd64 image was already built in Tier 2.5 and validated the
      # Dockerfile mechanically. Tier 3 additionally builds the arm64 variant
      # (the actual Hetzner CAX11 prod target, QEMU-emulated under buildx) and
      # runs Trivy against it. Splitting CI builds per architecture keeps
      # Tier 2.5 fast for the common develop → staging flow.
      - name: Set up QEMU (arm64 emulation)
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up buildx
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        uses: docker/setup-buildx-action@v3

      - name: Build production image (arm64 — Hetzner target)
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --load \
            -t chopnow-api:${{ github.sha }}-arm64 \
            .

      - name: Trivy container scan (arm64 image)
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: chopnow-api:${{ github.sha }}-arm64
          format: table
          severity: HIGH,CRITICAL
          # Block the merge on any HIGH or CRITICAL finding.
          exit-code: '1'
          # Don't fail solely on Trivy failing to fetch its DB (transient infra issue).
          ignore-unfixed: true

  # ─── Deploy: staging (DigitalOcean) ──────────────────────────────────
  # Fires on every push to `staging` (i.e. after a PR merge from develop).
  # Gated on `lint-test-build` succeeding for that same SHA.
  deploy-staging:
    needs: lint-test-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Placeholder — wire up SSH deploy once droplet IP is known
        # Once `STAGING_HOST` and `STAGING_SSH_KEY` are set in the
        # `staging` GitHub environment, replace this with:
        #   - actions/setup-buildx-action + login to ghcr.io
        #   - docker buildx build --platform linux/arm64 --push -t ghcr.io/<owner>/chopnow-api:staging-${{ github.sha }}
        #   - ssh deploy@<host> "cd /opt/chopnow && docker compose pull && docker compose up -d"
        run: |
          echo "::notice::Staging deploy placeholder. Provision DigitalOcean droplet, add STAGING_HOST + STAGING_SSH_KEY secrets to the 'staging' environment, then replace this step."

  # ─── Deploy: production (Hetzner) ────────────────────────────────────
  # Fires on every push to `main`. Same shape as staging — different secrets
  # and target host. Gated on `lint-test-build` (which already ran Trivy on
  # the PR that produced this commit, since main only accepts PR merges).
  deploy-production:
    needs: lint-test-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Placeholder — wire up SSH deploy once Hetzner CAX11 IP is known
        run: |
          echo "::notice::Production deploy placeholder. Provision Hetzner CAX11 (Falkenstein), add PROD_HOST + PROD_SSH_KEY secrets to the 'production' environment, then replace this step."
