# CI — Gate 1 (feature → develop) and required check for develop → main releases.
# Runs only on PRs, not on push (saves minutes; same SHA's already validated by the PR).

name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [develop, main]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx prisma generate

      # --- Required (block merge) ---
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Integration tests
        # ubuntu-latest runners ship with Docker — testcontainers boots a postgis image
        # and applies Prisma migrations against it. ~30s startup overhead per run; the
        # safety net of catching real-DB regressions before merge is worth it.
        run: npm run test:integration
      - name: Build
        run: npm run build

      # --- Required: fail on any high-severity vulnerability ---
      # We're at 0 vulns on develop after PR #102; this step's job is to keep us
      # there. Dependabot opens auto-fix PRs (see .github/dependabot.yml) which
      # become the way to clear new alerts — a PR that introduces one without
      # fixing it can no longer slip through.
      - name: Security audit
        run: npm audit --audit-level=high

      - name: Migration sanity check (warning only)
        if: contains(github.event.pull_request.changed_files, 'prisma/migrations/')
        run: |
          echo "::warning::This PR modifies Prisma migrations. Verify they're idempotent and reversible."
