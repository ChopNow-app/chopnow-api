# Multi-tier CI + deploy.
#
# Tier 1 — every feature-branch push + every PR: fast feedback for the
#         developer. Lint, typecheck, unit tests, dep audit, secret scan, SAST.
#         Targets ~1 minute.
#
# Tier 2 — every PR (skipped on feature pushes to save runner minutes):
#         Integration tests against an ephemeral PostGIS via testcontainers,
#         then a full nest build. Targets ~3 minutes.
#
# Tier 2.5 — PRs targeting `staging` or `main`: also build the production
#         Docker image. Catches Dockerfile regressions one tier earlier than
#         only-on-main.
#
# Tier 3 — PR → main only: Trivy scan of the built image. HIGH/CRITICAL
#         OS-level vulns block the merge.
#
# Deploy:
# - push to staging → deploy-staging job (DigitalOcean droplet, ~26 juin 2026)
# - push to main    → deploy-production job (Hetzner CAX11 Falkenstein)
#
# Why one CI job (and not three): the rulesets on `develop` / `staging` / `main`
# require the status check named `lint-test-build`. Splitting the gate jobs
# would force ruleset edits. We use step-level `if:` instead so the required
# check name stays stable while the work tiers up by trigger. Deploy jobs
# are separate (they don't gate merges, they react to merges).

name: CI

on:
  workflow_dispatch:
  # Run on push EXCEPT to develop (only ever PR-merged commits, already
  # validated by the PR's check). Staging and main DO get push CI because
  # we want a final post-merge validation gate before deploy fires.
  push:
    branches-ignore:
      - develop
  pull_request:
    branches: [develop, staging, main]

# Cancel in-progress runs on the same ref. Deploy jobs follow the gate; if
# a newer commit arrives mid-run, the older deploy is cancelled — the newer
# one runs to completion, leaving the system at the latest state.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    # Sidecar services available throughout the job. Redis boots in ~2s and is
    # required by AppModule (E2E tests import the full module). Postgres for
    # integration / E2E is provided via testcontainers — no service needed for it.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans git history — needs the full repo, not a shallow clone.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx prisma generate

      # ─── Tier 1: every push + every PR ───────────────────────────────
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Security audit (deps)
        # Blocks on high+ vulnerabilities. Dependabot opens auto-fix PRs
        # for routine updates; this gate makes sure no PR introduces a
        # known CVE without also resolving it.
        run: npm audit --audit-level=high

      - name: Secrets scan (gitleaks)
        # Catches accidentally committed credentials in the diff or history.
        # We use the binary directly (not gitleaks-action) because the action
        # requires a paid license for commercial orgs. Bump GITLEAKS_VERSION
        # manually on advisory; the binary is reproducible from a tagged release.
        run: |
          GITLEAKS_VERSION=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar xz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --redact --exit-code 1 --no-banner

      - name: SAST scan (Semgrep)
        # Static analysis for Node/TS security issues (auth bypass, SSRF, XSS,
        # SQL/NoSQL injection patterns, etc.). 0 findings on develop today;
        # any new PR that introduces a flagged pattern fails here.
        run: |
          python3 -m pip install --quiet semgrep
          semgrep scan \
            --config=p/typescript \
            --config=p/security-audit \
            --metrics=off \
            --error \
            src/

      # ─── Tier 2: PR only (skipped on feature pushes — too slow for inner loop) ─
      - name: Integration tests
        if: github.event_name == 'pull_request'
        # ubuntu-latest has Docker; testcontainers boots a postgis image and
        # applies Prisma migrations against it. ~30s overhead; catches real-DB
        # regressions (PostGIS, transactions, unique constraints) before merge.
        run: npm run test:integration

      - name: Build
        if: github.event_name == 'pull_request'
        run: npm run build

      - name: E2E tests
        # Boots the full AppModule against an ephemeral PostGIS via testcontainers,
        # overrides only the OtpDeliveryService to capture the plaintext OTP, then
        # exercises the real HTTP routes (request-otp → verify-otp → /users/me).
        # ~12s including container startup.
        if: github.event_name == 'pull_request'
        run: npm run test:e2e

      - name: Migration sanity check (warning only)
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.changed_files, 'prisma/migrations/')
        run: echo "::warning::This PR modifies Prisma migrations. Verify they're idempotent and reversible."

      # ─── Tier 2.5: PR → staging or main (image build) ────────────────
      # Catches Dockerfile regressions before they reach a deployable branch.
      # PR → develop deliberately skips this — fast inner loop matters more
      # there than catching prod-image issues that early.
      - name: Build production Docker image (amd64 — staging target)
        if: github.event_name == 'pull_request' && (github.base_ref == 'staging' || github.base_ref == 'main')
        # Native amd64 build on the ubuntu-latest runner. Validates that the
        # Dockerfile + production install graph still works — covers DO staging
        # which runs Intel/AMD x86_64. Hetzner prod runs arm64 (CAX11 Ampere);
        # that variant is built + scanned by the Trivy step below on PR → main.
        # Single-arch keeps this step fast (~20s) so the inner loop on
        # develop → staging stays tight.
        run: docker build -t chopnow-api:${{ github.sha }}-amd64 .

      # ─── Tier 3: PR → main only (arm64 build + Trivy) ────────────────
      # The amd64 image was already built in Tier 2.5 and validated the
      # Dockerfile mechanically. Tier 3 additionally builds the arm64 variant
      # (the actual Hetzner CAX11 prod target, QEMU-emulated under buildx) and
      # runs Trivy against it. Splitting CI builds per architecture keeps
      # Tier 2.5 fast for the common develop → staging flow.
      - name: Set up QEMU (arm64 emulation)
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up buildx
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        uses: docker/setup-buildx-action@v3

      - name: Build production image (arm64 — Hetzner target)
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --load \
            -t chopnow-api:${{ github.sha }}-arm64 \
            .

      - name: Trivy container scan (arm64 image)
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: chopnow-api:${{ github.sha }}-arm64
          format: table
          severity: HIGH,CRITICAL
          # Block the merge on any HIGH or CRITICAL finding.
          exit-code: '1'
          # Don't fail solely on Trivy failing to fetch its DB (transient infra issue).
          ignore-unfixed: true

  # ─── Deploy: staging (DigitalOcean) ──────────────────────────────────
  # Fires on every push to `staging` (i.e. after a PR merge from develop).
  # Gated on `lint-test-build` succeeding for that same SHA.
  #
  # Flow:
  #   1. Build the amd64 production image (DO Basic droplets are x86_64)
  #   2. Save → gzip → scp the tar to the droplet (no registry yet)
  #   3. Render .env from `staging` environment secrets
  #   4. scp .env + compose file to /opt/chopnow/staging/
  #   5. SSH: docker load → up -d db redis → migrate → up -d api
  #   6. Health check via SSH tunnel (3001 is bound to 127.0.0.1 only,
  #      not exposed externally yet)
  deploy-staging:
    needs: lint-test-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Build amd64 staging image
        run: docker build -t chopnow-api:staging-${{ github.sha }} .

      - name: Save image as tar.gz
        run: |
          docker save chopnow-api:staging-${{ github.sha }} | gzip > /tmp/chopnow-staging.tar.gz
          ls -lh /tmp/chopnow-staging.tar.gz

      - name: Set up SSH (deploy key)
        # webfactory/ssh-agent handles the agent lifecycle + cleans up
        # the private key from memory at job end. Cleaner than writing
        # the key to ~/.ssh/ ourselves.
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_KEY }}

      - name: Trust droplet host key
        run: ssh-keyscan -H ${{ secrets.STAGING_HOST }} >> ~/.ssh/known_hosts

      - name: Render .env from secrets
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
          STAGING_JWT_ACCESS_SECRET: ${{ secrets.STAGING_JWT_ACCESS_SECRET }}
          STAGING_JWT_REFRESH_SECRET: ${{ secrets.STAGING_JWT_REFRESH_SECRET }}
          SHA: ${{ github.sha }}
        run: |
          cat > /tmp/.env.staging <<EOF
          NODE_ENV=production
          PORT=3001
          APP_URL=http://${STAGING_HOST}:3001
          DB_PASSWORD=${STAGING_DB_PASSWORD}
          DATABASE_URL=postgresql://chopnow:${STAGING_DB_PASSWORD}@db:5432/chopnow?schema=public
          REDIS_HOST=redis
          REDIS_PORT=6379
          REDIS_PASSWORD=
          JWT_ACCESS_SECRET=${STAGING_JWT_ACCESS_SECRET}
          JWT_REFRESH_SECRET=${STAGING_JWT_REFRESH_SECRET}
          JWT_ACCESS_TTL=24h
          JWT_REFRESH_TTL=30d
          MAIL_FROM=ChopNow Staging <noreply@chopnow.app>
          THROTTLE_TTL_SECONDS=60
          THROTTLE_LIMIT=100
          CORS_ORIGINS=http://localhost:3000,http://${STAGING_HOST}:3001
          IMAGE_TAG=${SHA}
          EOF

      - name: Transfer artifacts to droplet
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
        run: |
          scp /tmp/chopnow-staging.tar.gz "${STAGING_USER}@${STAGING_HOST}:/opt/chopnow/staging/image.tar.gz"
          scp deploy/docker-compose.staging.yml "${STAGING_USER}@${STAGING_HOST}:/opt/chopnow/staging/docker-compose.yml"
          scp /tmp/.env.staging "${STAGING_USER}@${STAGING_HOST}:/opt/chopnow/staging/.env"
          # Local copy of the env file has plaintext secrets — wipe after upload.
          shred -u /tmp/.env.staging 2>/dev/null || rm -f /tmp/.env.staging

      - name: Deploy on droplet
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
        run: |
          ssh "${STAGING_USER}@${STAGING_HOST}" 'bash -s' <<'EOF'
          set -euo pipefail
          cd /opt/chopnow/staging

          # Load the image into the local docker daemon.
          gunzip -c image.tar.gz | docker load
          rm -f image.tar.gz

          # Bring up DB + Redis first; wait for healthy via depends_on at next
          # `up` call. Doing it in two steps makes the migration phase explicit.
          docker compose up -d db redis

          # Run Prisma migrations in a one-off container.
          #
          # Two stdin-related guards are needed here, both because we're inside
          # an `ssh host 'bash -s' <<'EOF' ... EOF` heredoc:
          #   -T              disables TTY allocation
          #   </dev/null      explicitly closes the container's stdin
          # Without BOTH, compose forwards the heredoc's remaining bytes into
          # the container as its stdin. The container silently consumes the
          # rest of the script and exits clean — the bash on the remote then
          # has no more commands to run, so `up -d api --force-recreate` and
          # the trailing `docker compose ps` never execute. Step exits 0,
          # CI goes green, operator is left wondering. We tried `-T` alone in
          # PR #115 — it disabled TTY but stdin was still attached, same
          # symptom. </dev/null is the actual fix.
          #
          # We call prisma via `node node_modules/prisma/build/index.js` because
          # npm/npx were stripped from the production image — see Dockerfile.
          docker compose run --rm -T api \
            node node_modules/prisma/build/index.js migrate deploy < /dev/null

          # Now bring up the API. --force-recreate handles two edge cases:
          # (1) Previous deploy left the api container in a crashloop (restart:
          #     unless-stopped). Compose's default `up -d` may not reliably
          #     touch a restarting container, leaving it stuck on the old image.
          # (2) Config drift between the on-disk compose.yml and what's running.
          # Cost: a few extra seconds per deploy. Worth it for idempotence.
          docker compose up -d api --force-recreate --remove-orphans

          # Show the resulting state for the workflow log.
          docker compose ps
          EOF

      - name: Health check
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
        run: |
          # 3001 is bound to 127.0.0.1 on the droplet (firewall doesn't even
          # need to forward it from the outside yet — that comes when nginx
          # + TLS land). So we ssh in and curl localhost.
          for i in 1 2 3 4 5 6; do
            if ssh "${STAGING_USER}@${STAGING_HOST}" 'curl -fs http://localhost:3001/health'; then
              echo
              echo "Health check passed on attempt $i"
              exit 0
            fi
            echo "attempt $i/6: not ready, retrying in 5s..."
            sleep 5
          done
          echo "Health check failed after 30s. Last 50 lines of api logs:"
          ssh "${STAGING_USER}@${STAGING_HOST}" \
            'cd /opt/chopnow/staging && docker compose logs api --tail=50'
          exit 1

  # ─── Deploy: production (Hetzner) ────────────────────────────────────
  # Fires on every push to `main`. Same shape as staging — different secrets
  # and target host. Gated on `lint-test-build` (which already ran Trivy on
  # the PR that produced this commit, since main only accepts PR merges).
  deploy-production:
    needs: lint-test-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Placeholder — wire up SSH deploy once Hetzner CAX11 IP is known
        run: |
          echo "::notice::Production deploy placeholder. Provision Hetzner CAX11 (Falkenstein), add PROD_HOST + PROD_SSH_KEY secrets to the 'production' environment, then replace this step."
