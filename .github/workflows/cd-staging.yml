# Continuous Deployment — staging (DigitalOcean droplet).
#
# Fires on every push to the `staging` branch (i.e. immediately after a
# squash-merged PR from `develop`). The PR's CI run already validated the
# tree state via ci.yml, so this workflow assumes the commit is good and
# focuses entirely on shipping the image + bringing up the API.
#
# Also supports `workflow_dispatch` so a stuck deploy can be re-triggered
# from the Actions UI on the same SHA without re-merging.
#
# Flow:
#   1. Login to ghcr.io with GITHUB_TOKEN
#   2. Build amd64 image (DO Basic droplets are x86_64) and push
#      ghcr.io/chopnow-app/chopnow-api:staging-<sha> + :staging
#   3. Render .env from `staging` environment secrets
#   4. scp .env + compose file to /opt/chopnow/staging/
#   5. SSH: docker compose pull → up db/redis → migrate → up -d api
#      --force-recreate
#   6. Health check via SSH tunnel (3001 is bound to 127.0.0.1 only)

name: CD — staging

on:
  workflow_dispatch:
  push:
    branches: [staging]

# Cancel an in-flight deploy when a newer commit arrives on staging.
# A partial deploy that gets cancelled is preferable to a stale image
# overwriting a newer one.
concurrency:
  group: cd-staging
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      packages: write # required to push to ghcr.io
    steps:
      - uses: actions/checkout@v4

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push amd64 staging image
        # Native amd64 build on the runner. ~30s build + ~30-60s push.
        # Two tags: `staging-<sha>` for traceability + a moving `staging`
        # pointer so rollback by tag works.
        #
        # Push wrapped in a retry loop after a recurring GHCR flake (3
        # occurrences in 2026-05 — issue #262). The error shape is
        # "unauthorized: User cannot be authenticated with the token
        # provided" landing AFTER most layers have already been pushed,
        # suggesting a token-state hiccup mid-push rather than a credential
        # problem at login time. Re-running the same job always succeeds.
        # The retry re-logs-in between attempts in case the docker config
        # has stale auth state, then exponential-backs-off.
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          IMAGE_REPO=ghcr.io/${{ github.repository_owner }}/chopnow-api
          IMAGE_REPO_LC=$(echo "$IMAGE_REPO" | tr '[:upper:]' '[:lower:]')
          docker build \
            -t "$IMAGE_REPO_LC:staging-${{ github.sha }}" \
            -t "$IMAGE_REPO_LC:staging" \
            .

          push_with_retry() {
            local image="$1"
            local attempt=1
            local max=3
            while [ $attempt -le $max ]; do
              if docker push "$image"; then
                return 0
              fi
              if [ $attempt -lt $max ]; then
                local delay=$((attempt * 10))
                echo "::warning::docker push $image failed (attempt $attempt/$max) — re-logging in and retrying in ${delay}s"
                echo "$GHCR_PASSWORD" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
                sleep $delay
              fi
              attempt=$((attempt + 1))
            done
            echo "::error::docker push $image failed after $max attempts"
            return 1
          }

          push_with_retry "$IMAGE_REPO_LC:staging-${{ github.sha }}"
          push_with_retry "$IMAGE_REPO_LC:staging"

      - name: Set up SSH (deploy key)
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_KEY }}

      - name: Trust droplet host key
        run: ssh-keyscan -H ${{ secrets.STAGING_HOST }} >> ~/.ssh/known_hosts

      - name: Render .env from secrets
        env:
          STAGING_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
          STAGING_JWT_ACCESS_SECRET: ${{ secrets.STAGING_JWT_ACCESS_SECRET }}
          STAGING_JWT_REFRESH_SECRET: ${{ secrets.STAGING_JWT_REFRESH_SECRET }}
          STAGING_APP_SECRET_ENVELOPE_KEY: ${{ secrets.STAGING_APP_SECRET_ENVELOPE_KEY }}
          STAGING_APP_URL: ${{ secrets.STAGING_APP_URL }}
          STAGING_CORS_ORIGINS: ${{ secrets.STAGING_CORS_ORIGINS }}
          STAGING_TWILIO_ACCOUNT_SID: ${{ secrets.STAGING_TWILIO_ACCOUNT_SID }}
          STAGING_TWILIO_AUTH_TOKEN: ${{ secrets.STAGING_TWILIO_AUTH_TOKEN }}
          STAGING_TWILIO_WHATSAPP_FROM: ${{ secrets.STAGING_TWILIO_WHATSAPP_FROM }}
          STAGING_TWILIO_STATUS_CALLBACK_URL: ${{ secrets.STAGING_TWILIO_STATUS_CALLBACK_URL }}
          STAGING_CAMPAY_API_URL: ${{ secrets.STAGING_CAMPAY_API_URL }}
          STAGING_CAMPAY_USERNAME: ${{ secrets.STAGING_CAMPAY_USERNAME }}
          STAGING_CAMPAY_PASSWORD: ${{ secrets.STAGING_CAMPAY_PASSWORD }}
          STAGING_CAMPAY_WEBHOOK_SECRET: ${{ secrets.STAGING_CAMPAY_WEBHOOK_SECRET }}
          STAGING_VAPID_PUBLIC_KEY: ${{ secrets.STAGING_VAPID_PUBLIC_KEY }}
          STAGING_VAPID_PRIVATE_KEY: ${{ secrets.STAGING_VAPID_PRIVATE_KEY }}
          STAGING_VAPID_SUBJECT: ${{ secrets.STAGING_VAPID_SUBJECT }}
          STAGING_R2_ACCOUNT_ID: ${{ secrets.STAGING_R2_ACCOUNT_ID }}
          STAGING_R2_ACCESS_KEY_ID: ${{ secrets.STAGING_R2_ACCESS_KEY_ID }}
          STAGING_R2_SECRET_ACCESS_KEY: ${{ secrets.STAGING_R2_SECRET_ACCESS_KEY }}
          STAGING_RESEND_API_KEY: ${{ secrets.STAGING_RESEND_API_KEY }}
          SHA: ${{ github.sha }}
        run: |
          cat > /tmp/.env.staging <<EOF
          NODE_ENV=production
          PORT=3001
          APP_URL=${STAGING_APP_URL}
          DB_PASSWORD=${STAGING_DB_PASSWORD}
          # DB hardening — explicit connection pool + statement timeout.
          # connection_limit=20: caps concurrent Prisma connections (default
          #   2*CPUs is too low on the small staging droplet).
          # pool_timeout=20: explicit pool-acquire timeout.
          # statement_timeout=30000: 30s server-side cap so a runaway query
          #   can't hold a connection indefinitely.
          DATABASE_URL=postgresql://chopnow:${STAGING_DB_PASSWORD}@db:5432/chopnow?schema=public&connection_limit=20&pool_timeout=20&statement_timeout=30000
          REDIS_HOST=redis
          REDIS_PORT=6379
          REDIS_PASSWORD=
          JWT_ACCESS_SECRET=${STAGING_JWT_ACCESS_SECRET}
          JWT_REFRESH_SECRET=${STAGING_JWT_REFRESH_SECRET}
          JWT_ACCESS_TTL=15m
          JWT_REFRESH_TTL=30d
          APP_SECRET_ENVELOPE_KEY=${STAGING_APP_SECRET_ENVELOPE_KEY}
          TWILIO_ACCOUNT_SID=${STAGING_TWILIO_ACCOUNT_SID}
          TWILIO_AUTH_TOKEN=${STAGING_TWILIO_AUTH_TOKEN}
          TWILIO_WHATSAPP_FROM=${STAGING_TWILIO_WHATSAPP_FROM}
          TWILIO_STATUS_CALLBACK_URL=${STAGING_TWILIO_STATUS_CALLBACK_URL}
          CAMPAY_API_URL=${STAGING_CAMPAY_API_URL}
          CAMPAY_USERNAME=${STAGING_CAMPAY_USERNAME}
          CAMPAY_PASSWORD=${STAGING_CAMPAY_PASSWORD}
          CAMPAY_WEBHOOK_SECRET=${STAGING_CAMPAY_WEBHOOK_SECRET}
          VAPID_PUBLIC_KEY=${STAGING_VAPID_PUBLIC_KEY}
          VAPID_PRIVATE_KEY=${STAGING_VAPID_PRIVATE_KEY}
          VAPID_SUBJECT=${STAGING_VAPID_SUBJECT}
          R2_ACCOUNT_ID=${STAGING_R2_ACCOUNT_ID}
          R2_ACCESS_KEY_ID=${STAGING_R2_ACCESS_KEY_ID}
          R2_SECRET_ACCESS_KEY=${STAGING_R2_SECRET_ACCESS_KEY}
          R2_BUCKET=chopnow-staging-media
          RESEND_API_KEY=${STAGING_RESEND_API_KEY}
          MAIL_FROM=ChopNow Staging <noreply@tchopnow.app>
          THROTTLE_TTL_SECONDS=60
          THROTTLE_LIMIT=100
          CORS_ORIGINS=${STAGING_CORS_ORIGINS}
          IMAGE_TAG=${SHA}
          EOF

      - name: Transfer config to droplet
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
        run: |
          scp deploy/docker-compose.staging.yml "${STAGING_USER}@${STAGING_HOST}:/opt/chopnow/staging/docker-compose.yml"
          scp /tmp/.env.staging "${STAGING_USER}@${STAGING_HOST}:/opt/chopnow/staging/.env"
          # Local copy of the env file has plaintext secrets — wipe after upload.
          shred -u /tmp/.env.staging 2>/dev/null || rm -f /tmp/.env.staging

      - name: Deploy on droplet
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          GHCR_USER: ${{ secrets.STAGING_GHCR_USER }}
          GHCR_TOKEN: ${{ secrets.STAGING_GHCR_TOKEN }}
        run: |
          ssh "${STAGING_USER}@${STAGING_HOST}" \
            "GHCR_USER='${GHCR_USER}' GHCR_TOKEN='${GHCR_TOKEN}' bash -s" <<'EOF'
          set -euo pipefail
          cd /opt/chopnow/staging

          # Login to ghcr.io. The package is private (org disallows public
          # packages), so the droplet needs to authenticate before pulling.
          # Token is a classic PAT with read:packages scope, stored in the
          # `staging` env secret STAGING_GHCR_TOKEN. Login is idempotent —
          # running on an already-authenticated host is a no-op.
          # --password-stdin keeps the token out of process listings; the
          # SSH-level exposure via the command argument is the one trade-off
          # (visible briefly in `ps` on the droplet during the 1-2s ssh exec).
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

          # Pull the image we just pushed.
          docker compose pull api

          # Bring up DB + Redis first; depends_on healthcheck in compose
          # gates the migration container's start.
          docker compose up -d db redis

          # Run Prisma migrations in a one-off container. Two stdin guards
          # are mandatory inside an ssh heredoc (we lost 65 minutes to this
          # on the first staging deploy — see runbook deploy-staging.md):
          #   -T              disables TTY allocation
          #   </dev/null      closes stdin so it can't be consumed by the
          #                   container as input
          docker compose run --rm -T api \
            node node_modules/prisma/build/index.js migrate deploy < /dev/null

          # Now bring up the API. --force-recreate handles two edge cases:
          # (1) Previous deploy left the container in a crashloop —
          #     `up -d` alone may not reliably touch a restarting container.
          # (2) Config drift between the on-disk compose.yml and what's running.
          docker compose up -d api --force-recreate --remove-orphans

          # Show the resulting state for the workflow log.
          docker compose ps

          # Reclaim disk on the droplet. Without this step, every deploy
          # leaves the previous `chopnow-api:staging-<sha>` image behind as
          # an untagged ~1.1GB layer set — 30 deploys filled a 48GB disk
          # and the deploy at 2026-05-21 12:07 / 17:37 UTC failed with
          # "no space left on device".
          #
          # What's kept:
          #   - The currently-running image (referenced by the api
          #     container; docker never prunes referenced images)
          #   - Any image younger than 24h (rollback target if today's
          #     deploy turns out bad — `docker compose up` it without
          #     re-pulling from GHCR)
          #
          # What's removed:
          #   - All untagged + tagged images >24h old that aren't
          #     referenced by a running container
          #   - Volumes NEVER pruned (Postgres + Redis state are safe)
          #
          # Idempotent — running on an already-clean host is a few-ms no-op.
          docker image prune -af --filter "until=24h"
          echo "Disk after prune:"
          df -h /
          EOF

      - name: Health check
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
        run: |
          # 3001 is bound to 127.0.0.1 on the droplet (no public exposure
          # yet — nginx + TLS land in a later PR). SSH in and curl localhost.
          for i in 1 2 3 4 5 6; do
            if ssh "${STAGING_USER}@${STAGING_HOST}" 'curl -fs http://localhost:3001/health'; then
              echo
              echo "Health check passed on attempt $i"
              exit 0
            fi
            echo "attempt $i/6: not ready, retrying in 5s..."
            sleep 5
          done
          echo "Health check failed after 30s. Last 50 lines of api logs:"
          ssh "${STAGING_USER}@${STAGING_HOST}" \
            'cd /opt/chopnow/staging && docker compose logs api --tail=50'
          exit 1
