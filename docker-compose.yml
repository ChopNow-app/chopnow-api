services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: chopnow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: chopnow
      POSTGRES_PASSWORD: chopnow
      POSTGRES_DB: chopnow
    ports:
      # Host port 5433 — internal stays 5432. Avoids clash with other local Postgres.
      - '5433:5432'
    volumes:
      - chopnow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U chopnow -d chopnow']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: chopnow-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - chopnow_redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  chopnow_pgdata:
  chopnow_redisdata:
