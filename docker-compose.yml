services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: chopnow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: chopnow
      POSTGRES_PASSWORD: chopnow
      POSTGRES_DB: chopnow
    ports:
      # Host port 5433 — internal stays 5432. Avoids clash with other local Postgres.
      - '5433:5432'
    volumes:
      - chopnow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U chopnow -d chopnow']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: chopnow-redis
    restart: unless-stopped
    # AOF persistence: every write fsync'd once per second. Loses ≤ 1s of
    # writes on a hard kill, vs the default RDB-only mode which can lose
    # minutes. Important because BullMQ stores its delayed-job state here —
    # losing those means orders missing their auto-expire / pre-order
    # promotion deadlines until the safety-net cron catches them.
    command: redis-server --appendonly yes --appendfsync everysec
    ports:
      - '6379:6379'
    volumes:
      - chopnow_redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  chopnow_pgdata:
  chopnow_redisdata:
